section: Q4
construct: integrated_information_use
baseline: R8-2026-main-tsui-v4

source_priority:
  normative_construct_boundary: 2026_problem_making_policy
  primary_item_architecture:
    - 2026_main
    - 2026_makeup
  historical_reference_only: "2025 and earlier"

scope_profiles:
  full:
    answer_numbers: [21, 36]
    answer_slot_count: 16
    subsection_required: [A, B]
    surface_family_required: true
    allowed_surface_families: [main_2026, makeup_2026]
  mini:
    answer_slot_count_soft_guideline: [4, 8]

hard_constraints:
  - full_q4_uses_answer_numbers_21_through_36_exactly_once
  - A_uses_21_through_28_and_B_uses_29_through_36
  - full_q4_declares_main_2026_or_makeup_2026_surface_family
  - A_q1_is_dialogue_based_two_answer_selection_for_21_22
  - A_q2_uses_23_through_26_for_research_structured_or_visual_materials
  - A_q3_uses_27_28_for_lecture_summary_or_structured_memo_two_answer_selection
  - B_follows_the_selected_2026_family_scaffold
  - answer_or_answer_set_is_unique_from_the_given_information
  - Chinese_is_natural_modern_simplified_Chinese
  - Japanese_instructions_are_natural_exam_Japanese
  - source_text_data_examples_and_answer_logic_are_original

surface_grammar:
  shared_A:
    q1:
      slots: [21, 22]
      expected_form: dialogue_then_choose_two_content_matches
    q2:
      slots: [23, 24, 25, 26]
      expected_form: research_documents_tables_graphs_or_text_plus_diagram
      main_2026_subpart_pattern: [2, 1, 1]
      makeup_2026_subpart_pattern: [2, 2]
    q3:
      slots: [27, 28]
      expected_form: lecture_summary_or_memo_then_choose_two
  main_2026_B:
    q1:
      slots: [29, 30]
      expected_form: checklist_or_conditions_then_choose_two
    q2:
      slots: [31, 32, 33]
      expected_form: profile_or_candidate_matching_then_infer_missing_information
    q3:
      slots: [34, 35, 36]
      expected_form: flow_or_rule_structure_then_general_principle_plus_two_case_applications
  makeup_2026_B:
    q1:
      slots: [29, 30]
      expected_form: chronological_operational_information_then_choose_two_plans_times_or_actions
    q2:
      slots: [31, 32, 33, 34]
      expected_form: compound_operational_sources_two_answers_then_second_practical_document_two_answers
    q3:
      slots: [35, 36]
      expected_form: final_reflection_or_summary_then_choose_two

scenario_architecture:
  principle: >-
    The content must be original, but the student-facing progression should visibly belong to the
    selected 2026 surface family. Do not replace the 2026 Q4 grammar with a generic multi-source
    reading worksheet.
  forbidden_shortcuts:
    - independent_questions_connected_only_by_topic
    - arbitrary_task_counts_that_break_the_21_28_and_29_36_groupings
    - A_without_a_dialogue_opening
    - A_q2_as_four_unrelated_single_choice_questions
    - A_q3_as_a_short_one_sentence_question
    - B_that_matches_neither_2026_main_nor_2026_makeup_surface_family
    - decorative_materials_not_needed_for_any_answer
    - copying_official_text_or_changing_only_nouns
    - overly_fragmented_card_like_materials

material_types:
  text:
    - dialogue
    - notice
    - poster
    - short_explanatory_text
    - profile
    - checklist
    - memo
    - reflection
    - interview
    - instructions
  structured:
    - table
    - timetable
    - chart
    - flowchart
    - social_feed
    - schematic_map
    - annotated_diagram

response_modes:
  single_choice:
    slots: 1
  multi_select:
    slots: [2, 3]
  multi_slot_choice:
    slots: [2, 3]
    option_reuse_rule_must_be_explicit: true

quality_guidance:
  evidence_locator_required: true
  distractor_error_path_required: true
  exam_like_page_density: true
  two_answer_selection_prominent: true
  direct_extraction_allowed_but_not_dominant: true
  quantitative_tasks_test_information_processing_not_heavy_arithmetic: true
  Japanese_instructions_should_resemble_DNC_exam_register: true
  Chinese_material_should_carry_the_information_not_Japanese_explanatory_scaffolding: true

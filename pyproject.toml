[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabito-common-test-chinese-itemgen"
version = "0.5.0"
description = "Internal full mock-exam production workflow for TABITO Education's Common Test Chinese materials."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
ui = [
  "streamlit>=1.40,<2",
  "pandas>=2,<3",
]

[project.scripts]
tabito-itemgen = "tabito_itemgen.cli:main"
tabito-itemgen-ui = "tabito_itemgen.ui_launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep CI focused on correctness while the legacy Q4 renderer/UI are gradually split.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Known legacy cleanup points, isolated from the v0.5 exam-production refactor.
"src/tabito_itemgen/render.py" = ["F541", "F841"]
"src/tabito_itemgen/ui_app.py" = ["F401"]
# These two v0.5 files still carry imports used by the next CLI/UI split in this PR.
# Keep the exemption narrow and remove it before v0.5.0 leaves draft status.
"src/tabito_itemgen/exam_models.py" = ["F401"]
"src/tabito_itemgen/exam_ui.py" = ["F401"]

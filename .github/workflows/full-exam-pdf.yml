name: full-exam-pdf

on:
  pull_request:
    paths:
      - "src/tabito_itemgen/exam_*.py"
      - "src/tabito_itemgen/render.py"
      - "src/tabito_itemgen/answer_sheet.py"
      - "src/tabito_itemgen/scoring.py"
      - "src/tabito_itemgen/artifact_preflight.py"
      - "tests/full_exam_factory.py"
      - "tests/test_full_exam_compile.py"
      - "tests/test_pilot_exam_001_render.py"
      - "tests/test_render_portability.py"
      - "tests/test_full_exam_rendering.py"
      - "tests/test_chart_rendering.py"
      - "tests/test_answer_sheet.py"
      - "tests/test_scoring.py"
      - "tests/test_artifact_preflight.py"
      - "pilots/exam_001/**"
      - "blueprints/**"
      - "prompts/**"
      - "templates/**"
  workflow_dispatch:

jobs:
  compile-fixture-and-pilot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python package
        run: pip install -e ".[dev]"
      - name: Install XeLaTeX and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-pictures texlive-lang-chinese \
            texlive-plain-generic fonts-noto-cjk
      - name: Render and preflight continuous full-exam schema fixture
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path

          from tests.full_exam_factory import build_exam
          from tabito_itemgen.exam_render import render_exam

          root = Path("ci-work")
          manifest, _ = build_exam(root, "main_2026")
          out = Path("ci-artifacts")
          out.mkdir(exist_ok=True)
          error = None
          try:
              outputs = render_exam(root, manifest.exam_id, compile_pdf=True)
              required = (
                  "student_tex", "student_pdf",
                  "teacher_tex", "teacher_pdf",
                  "answer_sheet_tex", "answer_sheet_pdf",
                  "answer_key", "scoring_scheme", "artifact_manifest",
              )
              for key in required:
                  path = outputs[key]
                  if path is None or not path.exists():
                      raise RuntimeError(f"missing output: {key}")
          except Exception as exc:
              error = exc
          finally:
              output_dir = root / "output" / manifest.exam_id
              if output_dir.exists():
                  for path in output_dir.iterdir():
                      if path.is_file() and path.suffix in {".tex", ".pdf", ".json", ".log"}:
                          shutil.copy2(path, out / path.name)
          if error is not None:
              raise error
          PY
      - name: Render and preflight real Pilot Exam 001
        if: success()
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path

          from tabito_itemgen.exam_render import render_exam

          exam_id = "TABITO-CN-PILOT-EXAM-001"
          root = Path("pilot-ci-work")
          source = Path("pilots/exam_001")
          target = root / "exam_bank" / "draft" / exam_id
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(source, target)

          out = Path("pilot-artifacts")
          out.mkdir(exist_ok=True)
          error = None
          try:
              outputs = render_exam(root, exam_id, compile_pdf=True)
              required = (
                  "student_tex", "student_pdf",
                  "teacher_tex", "teacher_pdf",
                  "answer_sheet_tex", "answer_sheet_pdf",
                  "answer_key", "scoring_scheme", "artifact_manifest",
              )
              for key in required:
                  path = outputs[key]
                  if path is None or not path.exists():
                      raise RuntimeError(f"missing Pilot output: {key}")
          except Exception as exc:
              error = exc
          finally:
              output_dir = root / "output" / exam_id
              if output_dir.exists():
                  for path in output_dir.iterdir():
                      if path.is_file() and path.suffix in {".tex", ".pdf", ".json", ".log"}:
                          shutil.copy2(path, out / path.name)
          if error is not None:
              raise error
          PY
      - name: Upload schema fixture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-exam-schema-fixture
          path: |
            ci-artifacts/*.tex
            ci-artifacts/*.pdf
            ci-artifacts/*.json
            ci-artifacts/*.log
          if-no-files-found: error
      - name: Upload Pilot Exam 001 preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-exam-001-preview
          path: |
            pilot-artifacts/*.tex
            pilot-artifacts/*.pdf
            pilot-artifacts/*.json
            pilot-artifacts/*.log
          if-no-files-found: ignore

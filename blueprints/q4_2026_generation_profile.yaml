baseline_version: R8-2026-main-tsui-v4
purpose: >-
  Production profile for original Q4 generation based on the 2026 main and makeup examinations.
  Earlier versions abstracted away too much of the observable item form. This version intentionally
  preserves the 2026 surface grammar while requiring original content, wording, data and logic.

hard_core:
  score: 60
  answer_numbers: [21, 36]
  answer_slot_count: 16
  subsections: [A, B]
  subsection_A_answer_slots: [21, 28]
  subsection_B_answer_slots: [29, 36]
  one_continuing_topic_or_activity: true
  substantial_multi_answer_selection: true
  information_processing_beyond_keyword_matching: true

surface_family_required_for_full:
  allowed:
    - main_2026
    - makeup_2026
  rule: >-
    A full generated Q4 must choose one family and follow its slot/task scaffold. Do not invent an
    unconstrained hybrid just to be original.

shared_A_surface_grammar:
  q1:
    answer_slots: [21, 22]
    form: chinese_dialogue_plus_two_answer_content_match
    option_count_guideline: [7, 8]
    role: introduce_theme_positions_and_questions
  q2:
    answer_slots: [23, 26]
    role: research_and_document_reading
    required_character: structured_or_visual_information
    family_variants:
      main_2026:
        subpart_slot_pattern: [2, 1, 1]
        typical_relations:
          - table_with_missing_labels_or_descriptions
          - graph_reading
          - related_graph_comparison
      makeup_2026:
        subpart_slot_pattern: [2, 2]
        typical_relations:
          - chart_statement_verification
          - explanatory_text_plus_diagram_integration
  q3:
    answer_slots: [27, 28]
    form: lecture_summary_or_structured_memo_plus_two_answer_content_match
    option_count_guideline: [6, 8]
    role: consolidate_and_deepen_A

B_surface_families:
  main_2026:
    q1:
      answer_slots: [29, 30]
      form: checklist_or_condition_document_plus_two_answer_selection
    q2:
      answer_slots: [31, 33]
      slot_pattern: [2, 1]
      form: profile_or_candidate_matching_followed_by_missing_information_inference
      notes:
        - use shared options or target profiles where natural
        - one task should require matching stated preferences/conditions to profiles or cases
        - final slot should infer what additional field/information is needed from the matching process
    q3:
      answer_slots: [34, 36]
      slot_pattern: [1, 2]
      form: rule_tree_flowchart_or_process_plus_principle_then_two_case_application
      notes:
        - first slot asks for a general implication/necessary action from the rule/process
        - final two slots apply the same structure to two concrete cases
  makeup_2026:
    q1:
      answer_slots: [29, 30]
      form: chronological_operational_information_plus_two_answer_plan_or_datetime_selection
      notes:
        - combine schedule/date/day/weather/crowding/availability or similarly meaningful conditions
    q2:
      answer_slots: [31, 34]
      slot_pattern: [2, 2]
      form: compound_operational_source_then_second_practical_document
      first_pair_sources:
        - map_or_route_information
        - memo_or_field_notes
        - system_or_annotated_diagram
      second_pair_sources:
        - interview_derived_flyer
        - instructions_or_safety_notice
        - another_realistic_practical_document
    q3:
      answer_slots: [35, 36]
      form: reflection_summary_or_opinion_text_plus_two_answer_content_match
      role: close_the_activity_by_synthesizing_what_was_learned

observed_response_patterns:
  - single_choice
  - multi_select_two
  - paired_or_multi_slot_shared_options

information_dependency_modes:
  - single_source
  - within_compound
  - cross_source
  - scenario_plus_source

cross_source_quality:
  definition: >-
    A cross_source label is valid only when the requested answer cannot be uniquely determined from
    any one cited source by itself. Merely mentioning facts from two sources in the correct option is
    not enough.
  construction_rules:
    - for a single-choice two-source task, design competing options so source A alone leaves at least two candidates and source B alone also leaves at least two candidates
    - a useful pattern is true_true / true_false / false_true / false_false, but wording should remain natural rather than mechanically symmetric
    - for multi-select synthesis, each correct option should contain a relation that joins evidence from separate materials rather than restating one source
    - if one source already states the survey conclusion and the policy in one paragraph, do not count a question that repeats that paragraph as cross-source merely because graphs are also cited
    - distractors should often preserve one source correctly and fail only on the second source or on the relation between them
  human_test:
    - cover_each_source_in_turn_and_ask_whether_the_key_is_still_unique
    - if_yes_for_any_single_source_rewrite_the_task_or_downgrade_dependency_mode

quality_shape:
  - direct_comprehension_and_deeper_processing_should_coexist
  - numerical_information_should_test_reading_judgment_not_heavy_arithmetic
  - two_answer_selection_should_be_prominent_as_in_both_2026_references
  - materials_should_have_exam_like_density_not_card_style_micro_snippets
  - Japanese_instruction_text_should_control_the_task_while_Chinese_material_carries_the_content
  - the_question_should_feel_like_one_DNC_Q4_not_a_collection_of_worksheet_cards
  - declared_cross_source_tasks_must_pass_the_single_source_ablation_test

originality_boundary:
  must_preserve:
    - the_selected_2026_surface_family
    - answer_slot_grouping_and_major_task_roles
    - exam_like_document_to_question_relationships
  must_change:
    - topic_and_scenario_content
    - proper_nouns
    - all_source_text
    - numerical_values
    - exact_answer_relations
    - distinctive_examples_or_cases
  prohibited:
    - copying_or_lightly_paraphrasing_official_passages_or_options
    - replacing_only_nouns_in_an_official_scenario
    - reproducing_the_same_case_logic_with_cosmetic_topic_changes
    - mixing_main_and_makeup_B_shapes_without_an_explicit_reason

not_hard_rules:
  - exact_material_count
  - exact_line_count
  - mandatory_specific_chart_type
  - mandatory_specific_real_world_topic
  - identical_option_count_for_every_task

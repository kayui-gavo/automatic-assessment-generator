exam:
  name: 共通テスト 中国語
  reference_year: 2026
  reference_label: R8
  blueprint_version: R8-2026-main-tsui-v2
  duration_minutes: 80
  total_score: 200
  answer_numbers: [1, 50]

reference_policy:
  tier_0_normative_policy:
    name: R8 / 2026 Common Test problem-making policy for non-English foreign languages
    role: construct_boundary_only
    url: https://www.dnc.ac.jp/news/albums/abm.php?d=355&f=abm00004500.pdf
    principles:
      - understand_information_and_intent_according_to_purpose_situation
      - organize_understood_information_and_judge_what_to_take_up
      - assess_language_knowledge_and_skills_supporting_communication
      - consider_students_who_begin_non_english_foreign_languages_in_high_school
    must_not_define:
      - q4_surface_architecture
      - exact_material_sequence
      - exact_response_mode_distribution

  tier_1_primary_blueprints:
    - id: R8_2026_main
      name: 2026 本試験 中国語
      authority: co_equal_primary
      url: https://www.dnc.ac.jp/kyotsu/kakomondai/r8/r8_honshiken_mondai.html
    - id: R8_2026_makeup
      name: 2026 追・再試験 中国語
      authority: co_equal_primary
      url: https://www.dnc.ac.jp/kyotsu/kakomondai/r8/r8_tuisaishiken_mondai.html

  interpretation_rule: >-
    The 2026 main and makeup examinations are co-equal item-writing references.
    Features shared by both define the hard 2026 core. Differences between them define legitimate
    variation. Do not infer a mandatory surface pattern from a feature that appears in only one paper.

  tier_2_historical_reference:
    years: "2025 and earlier"
    authority: secondary_only
    allowed_uses:
      - confirm_long_term_language_level
      - identify_stable_constructs
      - study_distractor_plausibility
      - study_instruction_wording_conventions
      - check_longitudinal_continuity
    forbidden_uses:
      - override_2026_main_or_makeup_structure
      - restore_an_older_item_pattern_because_it_was_common_before_2026
      - average_old_and_new_structures_into_a_hybrid_blueprint
      - use_pre2026_surface_architecture_as_the_default_generation_template

  conflict_rule: "Tier-1 evidence overrides pre-2026 patterns; Tier-0 constrains the construct but not the surface form."

sections:
  Q1:
    construct: pronunciation_and_pinyin
    score: 24
  Q2:
    construct: vocabulary_and_usage
    score: 16
  Q3:
    construct: expression
    score: 40
  Q4:
    construct: integrated_information_use
    score: 60
    answer_numbers: [21, 36]
    hard_core_2026:
      - exactly_16_answer_slots_for_full_q4
      - two_subsections_A_and_B
      - one_continuing_purposeful_context
      - heterogeneous_information_sources
      - substantial_multi_answer_selection
      - information_processing_beyond_keyword_matching
      - progression_in_how_information_is_used
    functional_range:
      A:
        - establish_context
        - investigate
        - understand
        - compare
        - organize_information
      B:
        - recontextualize_information
        - apply_conditions_or_rules
        - plan_or_select
        - interpret_routes_processes_or_cases
        - synthesize_or_reflect
    non_hard_tendencies:
      - tasks_and_materials_often_interleave_as_the_scenario_progresses
      - quantitative_or_visual_information_is_common
      - later_tasks_often_require_more_contextualized_use_of_information
  Q5:
    construct: long_reading
    score: 60

general_style:
  target_population: Japanese high-school learners of Chinese
  communication_oriented: true
  instructions_language: Japanese
  stimulus_language: Simplified Chinese
  avoid_hsk_drill_feel: true
  avoid_obscure_grammar_for_its_own_sake: true
  prefer_realistic_or_inquiry_based_contexts: true
  require_unique_answer_or_answer_set: true
  gloss_rare_or_domain_specific_words: true
  do_not_turn_information_processing_into_heavy_arithmetic: true

originality:
  copy_official_wording: false
  direct_scenario_reskinning: false
  copy_official_material_sequence: false
  copy_2026_main_pet_architecture: false
  copy_2026_makeup_autonomous_driving_architecture: false
  invented_real_world_attribution: false
  principle: >-
    Reproduce the shared 2026 constructs and information-use trajectory, not official wording,
    topic, characters, data, or distinctive material sequence. A new item should create a different
    information journey even when it measures similar abilities.

workflow:
  generation_mode: manual_chat
  required_states: [draft, reviewed, approved]
  blind_independent_review_required: true
  human_approval_required: true

sources:
  normative:
    - name: R8 / 2026 problem-making policy
      url: https://www.dnc.ac.jp/news/albums/abm.php?d=355&f=abm00004500.pdf
  primary:
    - name: R8 / 2026 main examination, Chinese
      url: https://www.dnc.ac.jp/kyotsu/kakomondai/r8/r8_honshiken_mondai.html
    - name: R8 / 2026 makeup/re-examination, Chinese
      url: https://www.dnc.ac.jp/kyotsu/kakomondai/r8/r8_tuisaishiken_mondai.html
  secondary_historical:
    note: "2025 and earlier are reference-only and must never override the 2026 dual baseline."

exam:
  name: 共通テスト 中国語
  reference_year: 2026
  reference_label: R8
  blueprint_version: R8-2026-main-tsui-v1
  duration_minutes: 80
  total_score: 200
  answer_numbers: [1, 50]

reference_policy:
  tier_1_primary_blueprints:
    - id: R8_2026_main
      name: 2026 本試験 中国語
      authority: primary
      url: https://www.dnc.ac.jp/kyotsu/kakomondai/r8/r8_honshiken_mondai.html
    - id: R8_2026_makeup
      name: 2026 追・再試験 中国語
      authority: primary
      url: https://www.dnc.ac.jp/kyotsu/kakomondai/r8/r8_tuisaishiken_mondai.html
  interpretation_rule: >-
    The 2026 main and 2026 makeup examinations are co-equal primary design references.
    Features shared by both define the core 2026 direction; differences between the two define
    legitimate variation inside that direction. Do not treat either one as a surface template.
  tier_2_historical_reference:
    years: "2025 and earlier"
    authority: secondary_only
    allowed_uses:
      - confirm_long_term_language_level
      - identify_stable_constructs
      - study_distractor_plausibility
      - study_instruction_wording_conventions
      - check_longitudinal_continuity
    forbidden_uses:
      - override_2026_main_or_makeup_structure
      - restore_an_older_item_pattern_because_it_was_common_before_2026
      - average_old_and_new_structures_into_a_hybrid_blueprint
      - use_pre2026_surface_architecture_as_the_default_generation_template
  conflict_rule: "2026 main/makeup evidence always takes precedence over 2025-and-earlier patterns."

sections:
  Q1:
    construct: pronunciation_and_pinyin
    score: 24
  Q2:
    construct: vocabulary_and_usage
    score: 16
  Q3:
    construct: expression
    score: 40
  Q4:
    construct: integrated_materials_reading
    score: 60
    answer_numbers: [21, 36]
    functional_phases:
      A: investigate_receive_understand_compare
      B: apply_information_in_a_later_context_and_synthesize
    primary_2026_direction:
      - one_continuing_purposeful_scenario
      - heterogeneous_realistic_materials
      - tasks_and_materials_can_interleave_as_the_scenario_progresses
      - progression_from_basic_comprehension_to_data_reading_and_integration
      - later_application_to_planning_matching_rules_processes_or_decisions
      - substantial_use_of_multi_select_or_multi_slot_answers
      - information_processing_over_keyword_matching
  Q5:
    construct: long_reading
    score: 60

general_style:
  target_population: Japanese high-school learners of Chinese
  communication_oriented: true
  instructions_language: Japanese
  stimulus_language: Simplified Chinese
  avoid_hsk_drill_feel: true
  avoid_obscure_grammar: true
  prefer_realistic_communication_contexts: true
  require_unique_answer: true
  gloss_rare_or_domain_specific_words: true

originality:
  copy_official_wording: false
  direct_scenario_reskinning: false
  copy_official_material_sequence: false
  copy_2026_main_pet_architecture: false
  copy_2026_makeup_autonomous_driving_architecture: false
  principle: >-
    Reproduce the shared 2026 constructs and information-processing trajectory, not official
    wording, topic, characters, data, or distinctive material sequence.

workflow:
  generation_mode: manual_chat
  required_states: [draft, reviewed, approved]
  blind_independent_review_required: true
  human_approval_required: true

sources:
  primary:
    - name: R8 / 2026 main examination, Chinese
      url: https://www.dnc.ac.jp/kyotsu/kakomondai/r8/r8_honshiken_mondai.html
    - name: R8 / 2026 makeup/re-examination, Chinese
      url: https://www.dnc.ac.jp/kyotsu/kakomondai/r8/r8_tuisaishiken_mondai.html
  secondary_historical:
    note: "2025 and earlier are reference-only and must never override the 2026 dual baseline."

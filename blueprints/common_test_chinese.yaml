exam:
  name: 共通テスト 中国語
  reference_year: 2026
  reference_label: R8
  blueprint_version: R8-2026-main-tsui-v4
  duration_minutes: 80
  total_score: 200
  answer_numbers: [1, 50]

reference_policy:
  tier_0_normative_policy:
    name: R8 / 2026 Common Test problem-making policy for non-English foreign languages
    role: construct_boundary_only
    url: https://www.dnc.ac.jp/news/albums/abm.php?d=355&f=abm00004500.pdf
    principles:
      - understand_information_and_intent_according_to_purpose_situation
      - organize_understood_information_and_judge_what_to_take_up
      - assess_language_knowledge_and_skills_supporting_communication
      - consider_students_who_begin_non_english_foreign_languages_in_high_school

  tier_1_primary_blueprints:
    - id: R8_2026_main
      name: 2026 本試験 中国語
      authority: co_equal_primary
      url: https://www.dnc.ac.jp/kyotsu/kakomondai/r8/r8_honshiken_mondai.html
    - id: R8_2026_makeup
      name: 2026 追・再試験 中国語
      authority: co_equal_primary
      url: https://www.dnc.ac.jp/kyotsu/kakomondai/r8/r8_tuisaishiken_mondai.html

  interpretation_rule: >-
    The 2026 main and makeup examinations are co-equal current blueprints. Their shared A-section
    grammar and their two observable B-section families should be preserved in full mock generation.
    Originality applies to content, wording, data, cases and answer logic; it does not require
    abandoning the 2026 student-facing item scaffold.

  tier_2_historical_reference:
    years: "2025 and earlier"
    authority: secondary_only
    allowed_uses:
      - confirm_long_term_language_level
      - identify_stable_constructs
      - study_distractor_plausibility
      - study_instruction_wording_conventions
      - check_longitudinal_continuity
    forbidden_uses:
      - override_2026_main_or_makeup_structure
      - restore_an_older_item_pattern_because_it_was_common_before_2026
      - average_old_and_new_structures_into_a_hybrid_blueprint

  conflict_rule: "Tier-1 determines current Q4 surface architecture; Tier-0 constrains the construct; Tier-2 is reference-only."

sections:
  Q1:
    construct: pronunciation_and_pinyin
    score: 24
  Q2:
    construct: vocabulary_and_usage
    score: 16
  Q3:
    construct: expression
    score: 40
  Q4:
    construct: integrated_information_use
    score: 60
    answer_numbers: [21, 36]
    full_surface_core:
      A:
        answer_numbers: [21, 28]
        q1: "21-22 dialogue + choose two"
        q2: "23-26 research/data documents"
        q3: "27-28 lecture/summary/memo + choose two"
      B:
        answer_numbers: [29, 36]
        allowed_families:
          - main_2026
          - makeup_2026
    main_2026_B:
      q1: "29-30 checklist/conditions + choose two"
      q2: "31-33 profile/candidate matching + infer missing information"
      q3: "34-36 rule/flow/process + principle + two case applications"
    makeup_2026_B:
      q1: "29-30 chronological operational information + plan/time selection"
      q2: "31-34 compound operational sources + practical document"
      q3: "35-36 reflection/summary + choose two"
  Q5:
    construct: long_reading
    score: 60

general_style:
  target_population: Japanese high-school learners of Chinese
  communication_oriented: true
  instructions_language: Japanese
  stimulus_language: Simplified Chinese
  avoid_hsk_drill_feel: true
  avoid_obscure_grammar_for_its_own_sake: true
  require_unique_answer_or_answer_set: true
  gloss_rare_or_domain_specific_words: true
  do_not_turn_information_processing_into_heavy_arithmetic: true
  preserve_exam_like_information_density: true

originality:
  copy_official_wording: false
  copy_official_data: false
  copy_official_cases: false
  light_paraphrase_official_passages: false
  noun_swap_reskin: false
  preserve_selected_2026_surface_family: true
  principle: >-
    Reproduce the 2026 Q4 item grammar and document-to-question relationships, while creating new
    scenario content, source text, numerical data, examples, cases, distractors and answer logic.

workflow:
  generation_mode: manual_chat
  required_states: [draft, reviewed, approved]
  blind_independent_review_required: true
  human_approval_required: true

sources:
  normative:
    - name: R8 / 2026 problem-making policy
      url: https://www.dnc.ac.jp/news/albums/abm.php?d=355&f=abm00004500.pdf
  primary:
    - name: R8 / 2026 main examination, Chinese
      url: https://www.dnc.ac.jp/kyotsu/kakomondai/r8/r8_honshiken_mondai.html
    - name: R8 / 2026 makeup/re-examination, Chinese
      url: https://www.dnc.ac.jp/kyotsu/kakomondai/r8/r8_tuisaishiken_mondai.html
  secondary_historical:
    note: "2025 and earlier are reference-only and must never override the 2026 dual baseline."

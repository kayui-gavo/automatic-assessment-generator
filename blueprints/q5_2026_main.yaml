quality_calibration:
  lexical_questions:
    - options should compete within the same part of speech and nearby semantic field
    - do not make the key recoverable by spotting one obvious antonym among three near-synonyms
    - prefer cases where at least two options are locally possible and broader context resolves the choice
  interpretation_questions:
    - distractors should reuse real textual information with a scope, causal, temporal, or perspective error
    - avoid one-line paraphrase questions whose wrong options are unrelated to the passage
  distractor_design:
    - every serious reading distractor should preserve at least one true proposition or real passage detail whenever possible
    - make the decisive error local: one wrong scope, causal link, temporal relation, actor, generalization, or responsibility assignment
    - do not use absurd reversals such as cancelling an activity that the passage explicitly says continued unless the option also contains enough true detail to compete
    - a student should need to locate the exact logical mismatch, not merely choose the only reasonable-sounding option
    - for multi-select whole-text items, wrong options should be partially supported by the passage and fail on one added or overgeneralized clause
  late_questions:
    - the final three questions must not ask the same thesis three times in different wording
    - distribute inference, organization/summary, and whole-text consistency across the late set
    - at least one task should require integrating separated paragraphs
    - Q9-Q11 should test different cognitive operations even when they draw on overlapping paragraphs

schema_requirements:
  article:
    - paragraphs with stable paragraph_id
    - anchors with stable anchor_id
  anchor_kinds:
    - blank
    - underline
    - phrase
    - sentence
    - time_marker
  tasks:
    - refer to anchors by id, never by substring search
    - preserve question_no separately from answer numbers
    - Q1 must use answer 37 only
    - Q2 must use answers 38 and 39 as an ordered two-slot task
    - Q10 must use answers 47 and 48 as an unordered two-answer task
    - Q11 must use answers 49 and 50 as an unordered two-answer task

